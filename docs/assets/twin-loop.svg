<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Performance Lab digital twin loop</title>
  <desc id="desc">Workout logs become a stress dose D(t), which updates athlete state S(t), which produces the next prescription u(t).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <path d="M0 0h1280v360H0z" fill="url(#accent)" opacity="0.05"/>
  <text x="48" y="56" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="3">DIGITAL TWIN</text>
  <text x="48" y="98" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">Model the athlete, not the workout.</text>
  <text x="48" y="132" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">One body. Many domains. A latent state S(t) that training actually updates.</text>

  <!-- loop nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(160,230)">
      <rect x="-90" y="-42" width="180" height="84" rx="16" fill="#122033" stroke="#2dd4bf" stroke-width="2"/>
      <text y="-8" fill="#2dd4bf" font-size="12" letter-spacing="1.5">INPUT</text>
      <text y="18" fill="#f8fafc" font-size="18" font-weight="600">Workout log</text>
    </g>
    <g transform="translate(430,230)">
      <rect x="-90" y="-42" width="180" height="84" rx="16" fill="#122033" stroke="#38bdf8" stroke-width="2"/>
      <text y="-8" fill="#38bdf8" font-size="12" letter-spacing="1.5">DOSE</text>
      <text y="18" fill="#f8fafc" font-size="18" font-weight="600">D(t)</text>
    </g>
    <g transform="translate(700,230)" filter="url(#glow)">
      <rect x="-90" y="-42" width="180" height="84" rx="16" fill="#15243a" stroke="#a78bfa" stroke-width="2"/>
      <text y="-8" fill="#c4b5fd" font-size="12" letter-spacing="1.5">STATE</text>
      <text y="18" fill="#f8fafc" font-size="18" font-weight="600">S(t)</text>
    </g>
    <g transform="translate(970,230)">
      <rect x="-90" y="-42" width="180" height="84" rx="16" fill="#122033" stroke="#f59e0b" stroke-width="2"/>
      <text y="-8" fill="#fbbf24" font-size="12" letter-spacing="1.5">OUTPUT</text>
      <text y="18" fill="#f8fafc" font-size="18" font-weight="600">u(t)</text>
    </g>
    <!-- arrows -->
    <path d="M250 230h80" stroke="url(#accent)" stroke-width="3" fill="none" marker-end=""/>
    <polygon points="332,224 348,230 332,236" fill="#38bdf8"/>
    <path d="M520 230h80" stroke="url(#accent)" stroke-width="3" fill="none"/>
    <polygon points="602,224 618,230 602,236" fill="#a78bfa"/>
    <path d="M790 230h80" stroke="url(#accent)" stroke-width="3" fill="none"/>
    <polygon points="872,224 888,230 872,236" fill="#f59e0b"/>
    <path d="M1060 230h70 v-150 H160 v66" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <polygon points="154,140 160,154 166,140" fill="#334155"/>
    <text x="610" y="92" fill="#64748b" font-size="12">prescribe → log → update → prescribe</text>
  </g>
</svg>
